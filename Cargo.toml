[package]
name = "tantra"
version = "0.2.0"
description = "Tantra — Intelligent Coworker. Engineering Loop Orchestrator that plans, delegates to OpenHands, tests, and learns."
edition = "2021"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
