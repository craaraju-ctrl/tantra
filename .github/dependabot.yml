# Dependabot — Automated Dependency Updates
# Docs: https://docs.github.com/en/code-security/dependabot
#
# Tantra has ~8 direct dependencies. We restrict to minor+patch updates
# because major version bumps often require code changes.

version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      rust-patches:
        applies-to: version-updates
        update-types:
          - "patch"
        patterns:
          - "*"
    ignore:
      # reqwent 0.13+ changes the query() API — needs code update
      - dependency-name: "reqwest"
        versions: [">=0.13"]
